openapi: 3.1.0
info:
  title: API da sample-solution
  version: 0.1.0
  description: |
    API HTTP da solução de referência. Recebe uma requisição em JSON, grava o conteúdo no S3 e
    inicia a máquina de estado `request-flow`, que valida, persiste e notifica de forma assíncrona.

    A resposta `202` só confirma o início da execução. O resultado aparece no DynamoDB (sucesso) ou
    na fila `dlq` (falha); os fluxos estão em `docs/fluxos.md`.

    A API não tem autenticação. Métodos não mapeados, como `GET /requests`, são respondidos pelo
    próprio API Gateway com `403` e `{"message":"Missing Authentication Token"}`.
servers:
  - url: http://localhost:4566/restapis/{apiId}/local/_user_request_
    description: API Gateway no Floci, stage local
    variables:
      apiId:
        default: replace-with-api-id
        description: >-
          Id da API REST. Obtenha com
          `aws --profile localstack apigateway get-rest-apis --query "items[?name=='local-sample-solution'].id" --output text`.
  - url: http://localhost:3000/local
    description: serverless-offline, stage local
tags:
  - name: requisicoes
    description: Entrada de requisições no fluxo de processamento
paths:
  /requests:
    post:
      tags:
        - requisicoes
      operationId: createRequest
      summary: Registra uma requisição e inicia o processamento
      description: |
        Grava o corpo, sem alteração, em `requests/{requestId}.json` no bucket de payloads e inicia
        uma execução da máquina de estado com nome igual ao `requestId`.

        O limite de tamanho (4096 bytes, parâmetro SSM `/sample-solution/<stage>/max-payload-bytes`)
        não é verificado aqui: payloads maiores recebem `202` e falham depois, no passo `validate`.
      security: []
      requestBody:
        required: true
        description: Qualquer documento JSON.
        content:
          application/json:
            schema:
              description: Qualquer documento JSON; o conteúdo não é interpretado pela API.
            examples:
              pedido:
                summary: Requisição de exemplo
                value:
                  customer: acme
                  amount: 42
      responses:
        "202":
          description: Requisição gravada e execução iniciada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestAccepted"
              examples:
                aceita:
                  value:
                    requestId: 8b2f674a-770f-4982-a3d1-c0141eeed347
                    executionArn: arn:aws:states:us-east-1:000000000000:execution:sample-solution-local-request-flow:8b2f674a-770f-4982-a3d1-c0141eeed347
        "400":
          description: Corpo ausente. A resposta não tem corpo.
        "415":
          description: "`Content-Type` diferente de `application/json`. A resposta não tem corpo."
        "500":
          description: >-
            Falha ao gravar no S3 ou ao iniciar a execução. Não reproduzido nos testes; o formato do
            corpo não foi verificado.
components:
  schemas:
    RequestAccepted:
      type: object
      required:
        - requestId
        - executionArn
      properties:
        requestId:
          type: string
          format: uuid
          description: Identificador da requisição; também é o nome da execução e parte da chave no S3.
        executionArn:
          type: string
          description: ARN da execução iniciada na máquina de estado `request-flow`.
