asyncapi: 3.1.0
info:
  title: Eventos da provider-solution
  version: 0.5.0
  description: |
    Eventos que a `provider-solution`, em Spring, publica no barramento da plataforma
    `platform-{stage}-events` ([ADR 0013](../../docs/decisoes/0013-barramento-da-plataforma.md)), com
    `source` `mmda.provider`. O desenho está em `docs/plataforma-de-cotacao.md` (§3, §5 e §8).

    Todo evento nasce de um item `OUTBOX#<eventId>` gravado na mesma transação do resultado
    ([ADR 0015](../../docs/decisoes/0015-modelo-dynamodb-e-outbox-da-cotacao.md)) e é publicado pela Lambda
    `outboxRelay` (stream da tabela `provider-solution-{stage}-queries`) ou pelo `reconciler`, que republica
    o outbox pendente a cada minuto. A entrega é pelo menos uma vez: o consumidor descarta a repetição pelo
    `eventId`, gravando o registro de consumo na mesma transação do efeito.

    Todo `detail` tem `eventId` (UUID), `occurredAt` (ISO 8601 em UTC, com milissegundos) e
    `schemaVersion` (`"1"`). Valores monetários são strings decimais com a moeda em `currency`. Campos
    opcionais ficam ausentes, nunca nulos. Nenhum evento leva credencial, CPF ou resposta bruta: a resposta
    do fornecedor fica no bucket `provider-solution-{stage}-payloads` e o evento leva só a chave
    (`rawResponseRef`).

    O `eventId` é determinístico: UUID versão 5 no namespace URL da RFC 9562
    (`6ba7b811-9dad-11d1-80b4-00c04fd430c8`), o mesmo da quote-solution, com o nome indicado em cada
    mensagem. O `queryId` é `q_` + os 32 primeiros hexadecimais do SHA-256 do `workRef` do pedido que abriu a
    consulta; num `EnrichmentResolved` com `HIT` ou `JOIN`, é o da consulta do líder, que produziu a evidência. O
    `attemptRef` é `<queryId>#<nnnn>`, a tentativa lógica que produziu o resultado.

    A provider consome `EnrichmentRequested` e `InsurerQuoteRequested`, descritos no AsyncAPI da
    `quote-solution`, pelas regras `source` `mmda.quote` com alvo nas filas
    `provider-solution-{stage}-enrichment-requests` e `provider-solution-{stage}-insurer-requests`. Os
    pedidos são deduplicados pelo `workRef`, não pelo `eventId` recebido: pela consulta derivada dele e, no
    enriquecimento, pelo registro de consumo com a chave UUIDv5 do `workRef` (o `eventId` que o contrato da quote
    atribui ao pedido), que cobre também os pedidos sem consulta própria (`HIT` e `JOIN`).

    Na seguradora assíncrona `beta`, a resposta `202` só traz o `providerRequestId`, e o resultado chega por
    callback na API da provider (`POST /v1/providers/{provider}/callbacks`, em
    `contracts/provider-solution/openapi.yaml`). O `InsurerResultRecorded` da beta é gravado por quem conclui o
    callback, a API ou o `insurerWorker` no encontro do `CORR#`, na mesma transação que passa o callback da inbox
    para processado e grava o registro de consumo do pedido; o formato e o `eventId` são os da seguradora
    síncrona.

    A partir do M4, a provider consome também o `QueryReconcileRequested` da quote, pela regra `source`
    `mmda.quote` com alvo na fila `provider-solution-{stage}-reconcile-requests`, e publica o `QueryReconciled` e as
    ocorrências operacionais (`OperationIssueRaised` e `OperationIssueUpdated`). Os três têm `eventId`
    determinístico e `revision` monotônico, mantido no item de origem da provider (`OPERATION#` e `ISSUE#`); a quote
    descarta revisões antigas. O `safeSummary` é um resumo em português, sem dado do risco, token ou resposta bruta.

    No M5, a quote projeta esses três eventos pela fila `quote-solution-{stage}-issues` (`issue-projector`): o
    `QueryReconciled` no `OPERATION#<operationId>` e as ocorrências no `ISSUE#<issueId>`, com o `type` do evento no
    `issueType`. O par `queryId` e `organizationId` de uma ocorrência é o que a quote grava no `QUERYREF#<queryId>`,
    que autoriza a reconciliação manual da consulta. A provider só põe nesse par a organização da própria consulta, lida
    da `QUERY` ou do pedido que a originou, nunca a de quem pediu a reconciliação.

    Os exemplos foram capturados no Floci, stage `local`, com pedidos publicados à mão no barramento. Nos do M4, a
    consulta `UNKNOWN` da alpha foi gravada à mão na tabela, para uma cotação inexistente, porque o simulador da alpha
    sempre responde; o `reconciler` e o `reconcileWorker` implantados produziram os eventos. Os
    exemplos `hit` e `join` do `EnrichmentResolved` reutilizam a evidência do exemplo `found`, com os
    identificadores calculados pelas regras acima. Nos exemplos da beta, o callback foi capturado no Floci
    (simulador, `simCallbackSender` e API de callbacks) para uma cotação calculada pelas regras acima, e o evento
    foi derivado dele pela classificação, sem publicar no barramento pedidos de cotações inexistentes.

    Os exemplos de `InsurerResultRecorded` com oferta são anteriores ao M5: trazem as coberturas que os simuladores
    montavam antes de ler o catálogo (três coberturas, com a `COLLISION` pelo valor de mercado e a franquia sobre
    ele). Desde o M5, as coberturas da oferta são as do perfil pedido no `contracts/fixtures/catalog.json` (o
    `COMPREHENSIVE` quando o pedido não traz perfil), e a franquia é de 5% (alpha) ou 4% (beta) do valor segurado da
    `COLLISION`; o formato do evento é o mesmo.
channels:
  platformEvents:
    address: platform-{stage}-events
    title: Barramento EventBridge da plataforma
    description: |
      Criado pela stack `platform/events`. A quote-solution assina `EnrichmentResolved` e
      `InsurerResultRecorded` com a regra `source` `mmda.provider` e alvo na fila
      `quote-solution-{stage}-results`; a partir do M5, assina `QueryReconciled`, `OperationIssueRaised` e
      `OperationIssueUpdated` com outra regra, de alvo na fila `quote-solution-{stage}-issues`.
    parameters:
      stage:
        $ref: '#/components/parameters/stage'
    messages:
      enrichmentResolved:
        $ref: '#/components/messages/EnrichmentResolved'
      insurerResultRecorded:
        $ref: '#/components/messages/InsurerResultRecorded'
      queryReconciled:
        $ref: '#/components/messages/QueryReconciled'
      operationIssueRaised:
        $ref: '#/components/messages/OperationIssueRaised'
      operationIssueUpdated:
        $ref: '#/components/messages/OperationIssueUpdated'
      enrichmentRequested:
        $ref: '../quote-solution/asyncapi.yaml#/components/messages/EnrichmentRequested'
      insurerQuoteRequested:
        $ref: '../quote-solution/asyncapi.yaml#/components/messages/InsurerQuoteRequested'
      queryReconcileRequested:
        $ref: '../quote-solution/asyncapi.yaml#/components/messages/QueryReconcileRequested'
operations:
  receiveEnrichmentRequested:
    action: receive
    title: O enrichmentWorker resolve o enriquecimento pedido pela quote
    description: |
      A regra entrega o envelope na fila `enrichment-requests` (lote 1, falha parcial, DLQ depois de 3
      recebimentos). O worker deriva a consulta do `workRef`, confere o `deadlineAt` e calcula a `queryKey`.
      Evidência válida no índice de reuso, gravada pela política em vigor, resolve o pedido sem chamada
      (`HIT`). Com outra consulta equivalente em voo, o pedido se registra como seguidor e recebe o resultado
      dela (`JOIN`). Senão, o worker assume a liderança com escrita condicional, reserva a quota, chama
      `POST /sim/enrichment/profiles` com `clientReference = queryId`, repete erros transitórios até
      `workerRetries` e grava, numa transação, evidência, índice de reuso (só em `FOUND` e `NOT_FOUND`; `FAILED`
      nunca entra nele), conclusão da liderança e o próprio `EnrichmentResolved` (`MISS`); depois publica um
      `EnrichmentResolved` para cada seguidor. Com o `deadlineAt` vencido antes da chamada, ou com a quota
      esgotada sem caber no prazo, o pedido conclui a própria consulta sem chamada e sem liderança, com `MISS` e
      `FAILED` (`DEADLINE_EXCEEDED_BEFORE_CALL` ou `QUOTA_EXHAUSTED`).
    channel:
      $ref: '#/channels/platformEvents'
    messages:
      - $ref: '#/channels/platformEvents/messages/enrichmentRequested'
  receiveInsurerQuoteRequested:
    action: receive
    title: O insurerWorker cota numa seguradora
    description: |
      A regra entrega o envelope na fila `insurer-requests`. Antes do HTTP o worker grava a consulta, a
      tentativa e o débito da quota; depois, a evidência e o `InsurerResultRecorded`. Na resposta `202` da
      seguradora assíncrona, grava o `providerRequestId` na consulta e na tentativa e faz a sua metade do
      encontro no `CORR#`; o resultado vem do callback. Uma reentrega relê a consulta e nunca repete uma chamada
      que pode ter chegado à seguradora: com `providerRequestId`, refaz a metade do encontro; sem resposta, a
      consulta fica `UNKNOWN` para a reconciliação (M4) e nenhum evento é publicado. A quota de cada provedor é
      comum a todos os workflows (T21).
    channel:
      $ref: '#/channels/platformEvents'
    messages:
      - $ref: '#/channels/platformEvents/messages/insurerQuoteRequested'
  receiveQueryReconcileRequested:
    action: receive
    title: O reconcileWorker reconcilia uma consulta a pedido de um operador (M4)
    description: |
      A regra entrega o envelope na fila `reconcile-requests` (lote 1, falha parcial, DLQ depois de 3 recebimentos).
      O pedido é deduplicado pelo `operationId`: o `reconcileWorker` grava o `OPERATION#` em `RUNNING`, confere que a
      consulta é da organização do pedido (a de outra organização é tratada como inexistente), reconcilia pelo mesmo
      caminho do `reconciler` e grava o resultado com o `QueryReconciled`, numa transação. A reconciliação nunca
      repete a chamada ao fornecedor: a consulta em voo além do prazo fica `UNKNOWN`, e a `UNKNOWN` de seguradora com
      API de situação (a `beta`) é concluída pelo `GET /sim/insurers/beta/quotes/{ref}`, com o
      `InsurerResultRecorded` de sempre. A reentrega depois do resultado não faz nada. A API da quote publica o pedido
      a partir do M5.
    channel:
      $ref: '#/channels/platformEvents'
    messages:
      - $ref: '#/channels/platformEvents/messages/queryReconcileRequested'
  emitEnrichmentResolved:
    action: send
    title: Resultado do enriquecimento, um por pedido
    channel:
      $ref: '#/channels/platformEvents'
    messages:
      - $ref: '#/channels/platformEvents/messages/enrichmentResolved'
  emitInsurerResultRecorded:
    action: send
    title: Resultado terminal de uma seguradora
    channel:
      $ref: '#/channels/platformEvents'
    messages:
      - $ref: '#/channels/platformEvents/messages/insurerResultRecorded'
  emitQueryReconciled:
    action: send
    title: Resultado de uma reconciliação manual (M4)
    description: |
      `SUCCEEDED` quando a consulta termina concluída, inclusive a que já estava; `FAILED` quando ela não existe para
      a organização, ainda está em voo dentro do prazo ou continua `UNKNOWN`. O `revision` é o do `OPERATION#`, em
      que o `RUNNING` é a revisão 1, então o resultado sai com a revisão 2.
    channel:
      $ref: '#/channels/platformEvents'
    messages:
      - $ref: '#/channels/platformEvents/messages/queryReconciled'
  emitOperationIssue:
    action: send
    title: Ocorrência operacional aberta ou atualizada (M4)
    description: |
      O `reconciler` abre a ocorrência na primeira revisão (`OperationIssueRaised`) e a atualiza nas seguintes
      (`OperationIssueUpdated`): ao resolvê-la, quando o problema some, ao reabri-la e, no `DEAD_LETTER`, a cada nova
      mensagem descartada do mesmo pedido. Observar de novo um problema aberto não publica nada. `UNKNOWN_QUERY`:
      consulta sem resposta que a API de situação não concluiu, ou sem API de situação (a única ocorrência
      `reconcilable`); `UNMATCHED_CALLBACK`: callback sem correlação depois do prazo, sem organização; `DEAD_LETTER`:
      mensagem descartada de uma DLQ depois de `dlqMaxAttempts` ou do prazo do pedido, ou já na primeira chegada
      quando é ilegível; `STALE_OUTBOX`: evento pendente de publicação além do limiar, pela idade do `createdAt`,
      exceto os próprios eventos de ocorrência. O `issueId` é `is_` + os 32 primeiros hexadecimais do SHA-256 de
      `type|alvo`.
    channel:
      $ref: '#/channels/platformEvents'
    messages:
      - $ref: '#/channels/platformEvents/messages/operationIssueRaised'
      - $ref: '#/channels/platformEvents/messages/operationIssueUpdated'
components:
  parameters:
    stage:
      description: Stage do Serverless Framework.
      default: local
      examples:
        - local
  messages:
    EnrichmentResolved:
      name: EnrichmentResolved
      title: Evento EnrichmentResolved
      summary: Resultado do enriquecimento para um pedido. `eventId` = UUIDv5 de `queryId|workRef`.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EnrichmentResolvedEvent'
      examples:
        - name: found
          payload:
            source: mmda.provider
            detail-type: EnrichmentResolved
            detail:
              eventId: 10e8cdee-fc77-5a26-b5b1-de8100101838
              occurredAt: '2026-11-11T19:31:15.035Z'
              schemaVersion: '1'
              workRef: wr_8829bb26c0c0a15c44c4cd6c5ef1e50f
              quoteId: m1chk-df5690-vehicle-hatch-2021
              version: 1
              queryId: q_d4392dcd44fa57aee4d5feed7aa86526
              evidenceId: ev_0f89e7a88012a89f201c0483e4e05cde
              reuseDecision: MISS
              policyVersion: reuse-v1
              resultType: FOUND
              result:
                vehicle:
                  ref: vehicle-hatch-2021
                  make: Volkswagen
                  model: Polo
                  year: 2021
                  marketValue: '75000.00'
                principalDriver:
                  ref: driver-acme-ana
                  licenseYears: 14
                  claimsLast5Years: 1
              reusableUntil: '2026-11-11T19:46:14.992Z'
        - name: not-found
          payload:
            source: mmda.provider
            detail-type: EnrichmentResolved
            detail:
              eventId: fd7a3501-0173-551c-8b4f-817ad995d999
              occurredAt: '2026-11-11T19:31:15.695Z'
              schemaVersion: '1'
              workRef: wr_ddcab35a31643c3f453b7e56f29e3eb4
              quoteId: m1chk-df5690-vehicle-not-found
