  schemas:
    Envelope:
      type: object
      description: |
        Envelope do EventBridge. O consumidor lê o `detail`; `source` é sempre `mmda.provider`.
      required:
        - source
        - detail-type
        - detail
      properties:
        version:
          type: string
        id:
          type: string
        source:
          const: mmda.provider
        account:
          type: string
        time:
          type: string
          format: date-time
        region:
          type: string
        resources:
          type: array
          items:
            type: string
    EnrichmentResolvedEvent:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            detail-type:
              const: EnrichmentResolved
            detail:
              $ref: '#/components/schemas/EnrichmentResolvedDetail'
    InsurerResultRecordedEvent:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            detail-type:
              const: InsurerResultRecorded
            detail:
              $ref: '#/components/schemas/InsurerResultRecordedDetail'
    QueryReconciledEvent:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            detail-type:
              const: QueryReconciled
            detail:
              $ref: '#/components/schemas/QueryReconciledDetail'
    OperationIssueEvent:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            detail-type:
              enum:
                - OperationIssueRaised
                - OperationIssueUpdated
            detail:
              $ref: '#/components/schemas/OperationIssueDetail'
    DetailHeader:
      type: object
      required:
        - eventId
        - occurredAt
        - schemaVersion
      properties:
        eventId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        schemaVersion:
          const: '1'
    EnrichmentResolvedDetail:
      allOf:
        - $ref: '#/components/schemas/DetailHeader'
        - type: object
          description: |
            Um evento por pedido (`workRef`), inclusive para cada seguidor de uma consulta compartilhada
            (`JOIN`) e para quem reutiliza uma evidência válida (`HIT`); nesses casos, `queryId` e
            `evidenceId` são os da consulta que produziu a evidência. `result` só existe em `FOUND`,
            `notFoundRefs` só em `NOT_FOUND` (declarado pelo provedor, RN07) e `errorClass` só em `FAILED`.
            `reusableUntil` existe nos resultados reutilizáveis (`FOUND` e `NOT_FOUND`); `FAILED` nunca entra
            no índice de reuso.
          required:
            - workRef
            - quoteId
            - version
            - queryId
            - evidenceId
            - reuseDecision
            - policyVersion
            - resultType
          properties:
            workRef:
              type: string
              pattern: '^wr_[0-9a-f]{32}$'
            quoteId:
              type: string
            version:
              type: integer
              minimum: 1
            queryId:
              type: string
              pattern: '^q_[0-9a-f]{32}$'
              description: Consulta que produziu a evidência; num `JOIN` ou `HIT`, a do líder.
            evidenceId:
              type: string
              pattern: '^ev_[0-9a-f]{32}$'
            reuseDecision:
              description: |
                `HIT` usou a evidência válida do índice de reuso, sem chamada externa; `JOIN` recebeu o
                resultado da consulta de outro pedido equivalente; `MISS` teve consulta própria: liderou a
                chamada ou concluiu sem chamada e sem liderança (prazo vencido ou quota esgotada, sempre
                `FAILED`).
              enum:
                - HIT
                - JOIN
                - MISS
            policyVersion:
              type: string
              pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
              description: |
                Versão da política de reuso da provider (parâmetro `reusePolicyVersion` do serverless.yml)
                que produziu a evidência. Ela vai também na evidência e no índice de reuso; um índice gravado
                por outra versão não serve de `HIT`. A quote a grava na evidência usada da versão.
            resultType:
              enum:
                - FOUND
                - NOT_FOUND
                - FAILED
            result:
              $ref: '#/components/schemas/EnrichmentProfile'
            notFoundRefs:
              type: array
              minItems: 1
              items:
                enum:
                  - vehicleRef
                  - principalDriverRef
            reusableUntil:
              type: string
              format: date-time
            errorClass:
              description: Código seguro da falha técnica, sem mensagem do fornecedor.
              enum:
                - PROVIDER_UNAVAILABLE
                - PROVIDER_NO_RESPONSE
                - PROVIDER_AUTHENTICATION_FAILED
                - PROVIDER_REJECTED_REQUEST
                - INVALID_PAYLOAD
                - INVALID_PROVIDER_RESPONSE
                - UNDECLARED_NOT_FOUND
                - DEADLINE_EXCEEDED_BEFORE_CALL
                - QUOTA_EXHAUSTED
                - INTERRUPTED_ATTEMPT
                - INTERRUPTED_BEFORE_CALL
    EnrichmentProfile:
      type: object
      description: Perfil normalizado. A regra de seleção `sel-1` da quote usa `vehicle.year`.
      required:
        - vehicle
        - principalDriver
      properties:
        vehicle:
          type: object
          required:
            - ref
            - year
            - marketValue
          properties:
            ref:
              type: string
            make:
              type: string
            model:
              type: string
            year:
              type: integer
            marketValue:
              type: string
              pattern: '^\d+(\.\d+)?$'
              description: Valor de mercado em BRL.
        principalDriver:
          type: object
          required:
            - ref
            - licenseYears
            - claimsLast5Years
          properties:
            ref:
              type: string
            licenseYears:
              type: integer
            claimsLast5Years:
              type: integer
    InsurerResultRecordedDetail:
      allOf:
        - $ref: '#/components/schemas/DetailHeader'
        - type: object
          description: |
            `offer` só existe em `QUOTED`; `missingFields` só em `NEEDS_INFORMATION`; `reasonCode` em todo
            status diferente de `QUOTED`. `attemptRef` falta quando a provider concluiu sem chamar a
            seguradora (prazo vencido, quota esgotada ou seguradora sem rota). `TIMED_OUT` não é publicado:
            é decidido pela máquina da quote.
          required:
            - workRef
            - quoteId
            - version
            - insurerId
            - queryId
            - status
          properties:
            workRef:
              type: string
              pattern: '^wr_[0-9a-f]{32}$'
            quoteId:
              type: string
            version:
              type: integer
              minimum: 1
            insurerId:
              type: string
            queryId:
              type: string
              pattern: '^q_[0-9a-f]{32}$'
            attemptRef:
              type: string
              pattern: '^q_[0-9a-f]{32}#[0-9]{4}$'
            status:
              enum:
                - QUOTED
                - DECLINED
                - NEEDS_INFORMATION
                - UNAVAILABLE
            reasonCode:
              type: string
              description: |
                Em `DECLINED`, o motivo da seguradora (como `RISK_NOT_ACCEPTED`); em `NEEDS_INFORMATION`,
                `INSURER_NEEDS_INFORMATION`; em `UNAVAILABLE`, um código técnico seguro:
                `PROVIDER_UNAVAILABLE`, `DEADLINE_EXCEEDED_BEFORE_CALL`, `QUOTA_EXHAUSTED`,
                `PROVIDER_REJECTED_REQUEST`, `PROVIDER_AUTHENTICATION_FAILED`, `INVALID_PROVIDER_RESPONSE` ou
                `UNSUPPORTED_INSURER`.
            missingFields:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/MissingField'
            offer:
              $ref: '#/components/schemas/Offer'
    MissingField:
      type: object
      required:
        - path
        - reasonCode
      properties:
        path:
          type: string
          description: Caminho relativo ao snapshot, como `risk.principalDriver.licenseDate`.
        reasonCode:
          type: string
    Offer:
      type: object
      description: |
        Oferta normalizada, nos mesmos campos do schema `Offer` de `contracts/openapi.yaml` (a quote acrescenta
        `id`, `insurerId`, `selectable` e `unavailabilityReason`). `rawResponseRef` é a chave da resposta bruta
        no bucket de payloads da provider.
      required:
        - externalOfferId
        - insurerName
        - premiumTotal
        - currency
        - installments
        - coverages
        - deductibles
        - validUntil
      properties:
        externalOfferId:
          type: string
        insurerName:
          type: string
        premiumTotal:
          type: string
          pattern: '^\d+(\.\d+)?$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        installments:
          type: array
          items:
            type: object
            required:
              - count
              - amount
            properties:
              count:
                type: integer
                minimum: 1
              amount:
                type: string
                pattern: '^\d+(\.\d+)?$'
        coverages:
          type: array
          items:
            type: object
            required:
              - code
              - label
            properties:
              code:
                type: string
              label:
                type: string
                description: |
                  Obrigatório, como no `OfferCoverage` de `contracts/openapi.yaml`; cobertura sem descrição da
                  seguradora torna a resposta `INVALID_PROVIDER_RESPONSE`.
              insuredAmount:
                type: string
                pattern: '^\d+(\.\d+)?$'
                description: Ausente quando a seguradora não informa; ausência não é zero.
        deductibles:
          type: array
          items:
            type: object
            required:
              - coverageCode
              - amount
            properties:
              coverageCode:
                type: string
              amount:
                type: string
                pattern: '^\d+(\.\d+)?$'
        validUntil:
          type: string
          format: date-time
          description: Validade informada pela seguradora, normalizada para UTC com milissegundos.
        rawResponseRef:
          type: string
    QueryReconciledDetail:
      allOf:
        - $ref: '#/components/schemas/DetailHeader'
        - type: object
          description: |
            Publicado pelo `reconcileWorker` (M4). `revision` é monotônico por `operationId`. `organizationId` e
            `queryId` são os do pedido, então o par não prova que a consulta é da organização; a de outra organização é
            tratada como inexistente (`FAILED`), sem revelar que existe. A quote projeta o resultado no
            `OPERATION#<operationId>` (M5).
          required:
            - operationId
            - organizationId
            - queryId
            - status
            - safeSummary
            - revision
          properties:
            operationId:
              type: string
            organizationId:
              type: string
            queryId:
              type: string
            status:
              enum:
                - SUCCEEDED
                - FAILED
            safeSummary:
              type: string
            revision:
              type: integer
              minimum: 1
    OperationIssueDetail:
      allOf:
        - $ref: '#/components/schemas/DetailHeader'
        - type: object
          description: |
            Publicado pelo `reconciler` (M4). `organizationId` falta quando a ocorrência não tem organização
            conhecida: no `UNMATCHED_CALLBACK`, no `DEAD_LETTER` de mensagem ilegível ou sem organização no
            payload (como o callback agendado da `sim-callbacks`) e no `STALE_OUTBOX` de evento sem consulta.
            `revision` é monotônico por `issueId`; a quote descarta versões antigas.
          required:
            - issueId
            - type
            - status
            - firstSeenAt
            - lastSeenAt
            - safeSummary
            - reconcilable
            - revision
          properties:
            issueId:
              type: string
              pattern: '^is_[0-9a-f]{32}$'
            organizationId:
              type: string
              description: Organização da consulta ou do pedido descartado; a quote indexa a ocorrência por ela.
            type:
              description: Tipo da ocorrência. No item `ISSUE#` das duas tabelas, fica no atributo `issueType`.
              enum:
                - UNKNOWN_QUERY
                - UNMATCHED_CALLBACK
                - DEAD_LETTER
                - STALE_OUTBOX
            status:
              enum:
                - OPEN
                - RESOLVED
            queryId:
              type: string
              description: |
                Consulta a que a ocorrência se refere, acompanhada do `organizationId` da própria consulta quando ele é
                conhecido (não é, por exemplo, no `STALE_OUTBOX` de evento cuja consulta não existe na provider). No
                `DEAD_LETTER` de um pedido de reconciliação, só aparece a consulta que existe e é da organização do pedido.
            quoteId:
              type: string
              description: |
                Cotação da consulta, quando conhecida; na consulta compartilhada de enriquecimento, a do líder. No
                `DEAD_LETTER` de um pedido de reconciliação, que não traz a cotação, ela vem da consulta da organização.
            firstSeenAt:
              type: string
              format: date-time
            lastSeenAt:
              type: string
              format: date-time
            safeSummary:
              type: string
            reconcilable:
              type: boolean
            revision:
              type: integer
              minimum: 1
