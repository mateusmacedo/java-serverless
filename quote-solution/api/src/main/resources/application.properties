quote.table-name=${TABLE_NAME}
quote.deadline-seconds=${QUOTE_DEADLINE_SECONDS}
quote.retry-after-seconds=${RETRY_AFTER_SECONDS}
quote.workflow-version=${WORKFLOW_VERSION}
quote.auth.client-id=${COGNITO_CLIENT_ID}
# Access tokens do user pool Cognito da stack (§11 do desenho)
mp.jwt.verify.issuer=${JWT_ISSUER}
mp.jwt.verify.publickey.location=${JWT_ISSUER}/.well-known/jwks.json
smallrye.jwt.path.groups="cognito:groups"
smallrye.jwt.required.claims=token_use,client_id
# WHY: sem autenticação proativa, as falhas de token chegam aos mappers e respondem no formato de erro do contrato
quarkus.http.auth.proactive=false
# Mesmo client HTTP do spring-aws da plataforma Spring (ADR 0005)
quarkus.dynamodb.sync-client.type=aws-crt
# WHY: os Dev Services subiriam um LocalStack; o ambiente local é o Floci, nos testes e nas Lambdas
quarkus.devservices.enabled=false
%test.quote.table-name=quotes-table
%test.quote.deadline-seconds=300
%test.quote.retry-after-seconds=3
%test.quote.workflow-version=test
%test.quote.auth.client-id=test-client
%test.mp.jwt.verify.issuer=https://issuer.test/pool
# WHY: com NONE o smallrye-jwt não gera o par em memória do build de teste, cuja chave pública venceria o JWKS
# do FlociResource; a chave de verificação vem do recurso de teste de cada classe
%test.mp.jwt.verify.publickey.location=NONE
%test.quarkus.http.test-port=0
