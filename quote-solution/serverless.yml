service: quote-solution

frameworkVersion: "4"

plugins:
  - serverless-step-functions
  - serverless-localstack

# Valores do §12 do desenho: default com os da AWS e local só com o que difere no Floci. O
# FunctionTimingConfigurationTest confere as invariantes de orçamento e de visibilidade × timeout em cada stage
params:
  default:
    # WHY: vazio na AWS, a condição HasAwsEndpointUrl tira o AWS_ENDPOINT_URL das funções e o SDK resolve o
    # endpoint pela região; o SDK trataria um valor vazio como endpoint, então a variável não pode existir
    awsEndpointUrl: ""
    jwtIssuerBase: https://cognito-idp.${aws:region}.amazonaws.com
    quoteDeadlineSeconds: 300
    workflowMarginSeconds: 60
    # quoteDeadlineSeconds + workflowMarginSeconds: o Serverless não soma variáveis
    workflowTimeoutSeconds: 360
    enrichmentTimeoutSeconds: 20
    insurerTimeoutSeconds: 90
    mapConcurrency: 2
    maxInsurers: 2
    stepsMarginSeconds: 30
    retryAfterSeconds: 3
    outboxRepublishAfterSeconds: 30
    reconcilerSchedule: rate(1 minute)
    stepsTimeoutSeconds: 15
    dispatchTimeoutSeconds: 15
    resumeTimeoutSeconds: 15
    relayTimeoutSeconds: 30
    reconcilerTimeoutSeconds: 60
    resultsVisibilityTimeoutSeconds: 90
    resultsMaxReceiveCount: 5
    # Fila issues do issue-projector (M5, §12): mesmos valores da results
    issueProjectorTimeoutSeconds: 15
    issuesVisibilityTimeoutSeconds: 90
    issuesMaxReceiveCount: 5
    # Reconciliação do M4 (§9): tentativas da DLQ contando a entrega original (ADR 0007), margem do
    # STUCK_VERSION e idade do RESUMING que o reconciler retoma, maior que o timeout do resume
    dlqMaxAttempts: 3
    stuckVersionMarginSeconds: 120
    resumingRetryAfterSeconds: 30
    # Limiares dos alarmes (§12)
    alarmPeriodSeconds: 60
    dlqAlarmMessages: 1
    dlqAlarmAgeSeconds: 300
    outboxAlarmAgeSeconds: 120
    expiredTasksAlarmThreshold: 1
    # NOTE: vazio não cria a assinatura por e-mail do tópico de alarmes
    alarmEmail: ""
  local:
    awsEndpointUrl: http://floci:4566
    jwtIssuerBase: http://floci:4566
    insurerTimeoutSeconds: 20

custom:
  names:
    table: ${self:service}-${sls:stage}-quotes
    resultsQueue: ${self:service}-${sls:stage}-results
    resultsDeadLetterQueue: ${self:service}-${sls:stage}-results-dlq
    issuesQueue: ${self:service}-${sls:stage}-issues
    issuesDeadLetterQueue: ${self:service}-${sls:stage}-issues-dlq
    streamFailuresQueue: ${self:service}-${sls:stage}-stream-failures
    stateMachine: ${self:service}-${sls:stage}-quote-flow
    tokenKeySecret: ${self:service}/${sls:stage}/token-key
    userPool: ${self:service}-${sls:stage}-users
    userPoolClient: ${self:service}-${sls:stage}-web
    # Barramento da plataforma pela convenção de nomes, sem referência entre stacks (ADR 0013)
    platformEventBus: platform-${sls:stage}-events
  stateMachineArn: arn:aws:states:${aws:region}:${aws:accountId}:stateMachine:${self:custom.names.stateMachine}
  platformEventBusArn: arn:aws:events:${aws:region}:${aws:accountId}:event-bus/${self:custom.names.platformEventBus}
  # Versão do workflow gravada em cada versão da cotação; mude junto com a definição da máquina
  workflowVersion: quote-flow-1
  # Namespace das métricas EMF do reconciler e dos alarmes sobre elas (§9)
  metricsNamespace: mmda/${self:service}
  functionsPackage: functions/target/quote-functions-lambda.zip
  # Handler das duas extensões usadas (quarkus-amazon-lambda e quarkus-amazon-lambda-rest)
  quarkusHandler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
  functionLogGroupArn: arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}
  localstack:
    stages:
      - local
    host: http://localhost
    edgePort: 4566
    autostart: false

provider:
  name: aws
  runtime: java21
  region: us-east-1
  stage: ${opt:stage, 'local'}
  # WHY: padrão de todas as funções; 1.769 MB equivale a 1 vCPU na Lambda, que reparte CPU pela memória
  memorySize: 1769
  environment:
    AWS_ENDPOINT_URL: !If [HasAwsEndpointUrl, "${param:awsEndpointUrl}", !Ref AWS::NoValue]
    TABLE_NAME: ${self:custom.names.table}
    EVENT_BUS_NAME: ${self:custom.names.platformEventBus}
    STATE_MACHINE_ARN: ${self:custom.stateMachineArn}
    TOKEN_KEY_SECRET_ID: ${self:custom.names.tokenKeySecret}
    MAX_INSURERS: "${param:maxInsurers}"
    OUTBOX_REPUBLISH_AFTER_SECONDS: "${param:outboxRepublishAfterSeconds}"
    QUOTE_DEADLINE_SECONDS: "${param:quoteDeadlineSeconds}"
    RETRY_AFTER_SECONDS: "${param:retryAfterSeconds}"
    WORKFLOW_VERSION: ${self:custom.workflowVersion}
    # Usados só pelo reconciler; ficam aqui porque o zip das functions valida a configuração ao subir
    RESULTS_QUEUE_URL: !Ref ResultsQueue
    RESULTS_DLQ_URL: !Ref ResultsDeadLetterQueue
    ISSUES_QUEUE_URL: !Ref IssuesQueue
    ISSUES_DLQ_URL: !Ref IssuesDeadLetterQueue
    DLQ_MAX_ATTEMPTS: "${param:dlqMaxAttempts}"
    STUCK_VERSION_MARGIN_SECONDS: "${param:stuckVersionMarginSeconds}"
    RESUMING_RETRY_AFTER_SECONDS: "${param:resumingRetryAfterSeconds}"
    METRICS_NAMESPACE: ${self:custom.metricsNamespace}
    STAGE: ${sls:stage}

package:
  individually: true

functions:
  api:
    handler: ${self:custom.quarkusHandler}
    timeout: 29
    role: ApiRole
    package:
      artifact: api/target/quote-api-lambda.zip
    environment:
      COGNITO_CLIENT_ID: !Ref QuoteUserPoolClient
      # O issuer do Floci usa o host do FLOCI_HOSTNAME; na AWS, https://cognito-idp.<region>.amazonaws.com
      JWT_ISSUER: !Join ["", ["${param:jwtIssuerBase}/", !Ref QuoteUserPool]]
    events:
      - http:
          path: v1/{proxy+}
          method: any

  workflowSteps:
    handler: ${self:custom.quarkusHandler}
    timeout: ${param:stepsTimeoutSeconds}
    role: WorkflowStepsRole
    package:
      artifact: ${self:custom.functionsPackage}
    environment:
      QUARKUS_LAMBDA_HANDLER: workflow-steps

  dispatch:
    handler: ${self:custom.quarkusHandler}
    timeout: ${param:dispatchTimeoutSeconds}
    role: DispatchRole
    package:
      artifact: ${self:custom.functionsPackage}
    environment:
      QUARKUS_LAMBDA_HANDLER: dispatch

  resume:
    handler: ${self:custom.quarkusHandler}
    timeout: ${param:resumeTimeoutSeconds}
    role: ResumeRole
    package:
      artifact: ${self:custom.functionsPackage}
    environment:
      QUARKUS_LAMBDA_HANDLER: resume
    events:
      - sqs:
          arn: !GetAtt ResultsQueue.Arn
          batchSize: 1
          functionResponseType: ReportBatchItemFailures

  issueProjector:
    handler: ${self:custom.quarkusHandler}
    timeout: ${param:issueProjectorTimeoutSeconds}
    role: IssueProjectorRole
    package:
      artifact: ${self:custom.functionsPackage}
    environment:
      QUARKUS_LAMBDA_HANDLER: issue-projector
    events:
      - sqs:
          arn: !GetAtt IssuesQueue.Arn
          batchSize: 1
          functionResponseType: ReportBatchItemFailures

  outboxRelay:
    handler: ${self:custom.quarkusHandler}
    timeout: ${param:relayTimeoutSeconds}
    role: OutboxRelayRole
    package:
      artifact: ${self:custom.functionsPackage}
    environment:
      QUARKUS_LAMBDA_HANDLER: outbox-relay
    events:
      # Só os INSERT de outbox chegam; a relay publica registro a registro (§7 do desenho)
      - stream:
          type: dynamodb
          arn: !GetAtt QuotesTable.StreamArn
          batchSize: 100
          startingPosition: TRIM_HORIZON
          maximumRetryAttempts: 3
          bisectBatchOnFunctionError: true
          functionResponseType: ReportBatchItemFailures
          destinations:
            onFailure:
              arn: !GetAtt StreamFailuresQueue.Arn
              type: sqs
          filterPatterns:
            - eventName:
                - INSERT
              dynamodb:
                NewImage:
                  type:
                    S:
                      - OUTBOX

  reconciler:
    handler: ${self:custom.quarkusHandler}
    timeout: ${param:reconcilerTimeoutSeconds}
    role: ReconcilerRole
    package:
      artifact: ${self:custom.functionsPackage}
    environment:
      QUARKUS_LAMBDA_HANDLER: reconciler
    events:
      - schedule:
          method: scheduler
          rate: ${param:reconcilerSchedule}
          input:
            source: schedule

stepFunctions:
  stateMachines:
    quoteFlow:
      id: QuoteFlowStateMachine
      name: ${self:custom.names.stateMachine}
      definition:
        Comment: Quotes one version of a quote; business data stays in DynamoDB, the state carries only references
        # Rede de segurança: o prazo real vem da invariante de orçamento (§9 do desenho)
        TimeoutSeconds: ${param:workflowTimeoutSeconds}
        StartAt: LoadQuoteSnapshot
        States:
          LoadQuoteSnapshot:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName:
                Fn::GetAtt: [workflowSteps, Arn]
              Payload:
                step: load-snapshot
                quoteId.$: $.quoteId
                version.$: $.version
            ResultSelector:
              organizationId.$: $.Payload.organizationId
              deadlineAt.$: $.Payload.deadlineAt
            ResultPath: $.context
            TimeoutSeconds: ${param:stepsTimeoutSeconds}
            # Só falhas de invocação; States.Timeout nunca é repetido (§6 do desenho)
            Retry: &lambdaInvocationRetry
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                IntervalSeconds: 1
                MaxAttempts: 3
                BackoffRate: 2
            Next: EvaluateEligibility
          EvaluateEligibility:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName:
                Fn::GetAtt: [workflowSteps, Arn]
              Payload:
                step: evaluate-eligibility
                quoteId.$: $.quoteId
                version.$: $.version
            ResultSelector:
              decision.$: $.Payload.decision
              reasonCode.$: $.Payload.reasonCode
              missingFields.$: $.Payload.missingFields
            ResultPath: $.eligibility
            TimeoutSeconds: ${param:stepsTimeoutSeconds}
            Retry: *lambdaInvocationRetry
            Next: IsEligible
          IsEligible:
            Type: Choice
            Choices:
              - Variable: $.eligibility.decision
                StringEquals: ELIGIBLE
                Next: ResolveEnrichment
            Default: ConsolidateQuote
          ResolveEnrichment:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke.waitForTaskToken
            Parameters:
              FunctionName:
                Fn::GetAtt: [dispatch, Arn]
              Payload:
                kind: ENRICHMENT
                quoteId.$: $.quoteId
                version.$: $.version
                executionArn.$: $$.Execution.Id
                taskToken.$: $$.Task.Token
                timeoutSeconds: ${param:enrichmentTimeoutSeconds}
            TimeoutSeconds: ${param:enrichmentTimeoutSeconds}
            ResultPath: $.enrichment
            Retry: *lambdaInvocationRetry
            Catch:
              - ErrorEquals:
                  - States.Timeout
                ResultPath: $.enrichmentError
                Next: RecordEnrichmentOutcome
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.enrichmentError
                Next: RecordEnrichmentOutcome
            Next: IsEnrichmentFound
          RecordEnrichmentOutcome:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName:
                Fn::GetAtt: [workflowSteps, Arn]
              Payload:
                step: record-enrichment-outcome
                quoteId.$: $.quoteId
                version.$: $.version
                error.$: $.enrichmentError
            ResultSelector:
              resultType.$: $.Payload.resultType
            ResultPath: $.enrichment
            TimeoutSeconds: ${param:stepsTimeoutSeconds}
            Retry: *lambdaInvocationRetry
            Next: IsEnrichmentFound
          IsEnrichmentFound:
            Type: Choice
            Choices:
              - Variable: $.enrichment.resultType
                StringEquals: FOUND
                Next: SelectInsurers
            Default: ConsolidateQuote
          SelectInsurers:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName:
                Fn::GetAtt: [workflowSteps, Arn]
              Payload:
                step: select-insurers
                quoteId.$: $.quoteId
                version.$: $.version
            ResultSelector:
              insurers.$: $.Payload.insurers
              count.$: $.Payload.count
            ResultPath: $.selection
            TimeoutSeconds: ${param:stepsTimeoutSeconds}
            Retry: *lambdaInvocationRetry
            Next: HasInsurers
          HasInsurers:
            Type: Choice
            Choices:
              - Variable: $.selection.count
                NumericGreaterThan: 0
                Next: QuoteInsurers
            Default: ConsolidateQuote
          QuoteInsurers:
            Type: Map
            ItemsPath: $.selection.insurers
            MaxConcurrency: ${param:mapConcurrency}
            ItemSelector:
              quoteId.$: $.quoteId
              version.$: $.version
              insurerId.$: $$.Map.Item.Value
              executionArn.$: $$.Execution.Id
            ItemProcessor:
              ProcessorConfig:
                Mode: INLINE
              StartAt: RequestInsurerQuote
              States:
                RequestInsurerQuote:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke.waitForTaskToken
                  Parameters:
                    FunctionName:
                      Fn::GetAtt: [dispatch, Arn]
                    Payload:
                      kind: INSURER
                      quoteId.$: $.quoteId
                      version.$: $.version
                      insurerId.$: $.insurerId
                      executionArn.$: $.executionArn
                      taskToken.$: $$.Task.Token
                      timeoutSeconds: ${param:insurerTimeoutSeconds}
                  TimeoutSeconds: ${param:insurerTimeoutSeconds}
                  Retry: *lambdaInvocationRetry
                  Catch:
                    - ErrorEquals:
                        - States.Timeout
                      ResultPath: $.error
                      Next: RecordInsurerTimeout
                    - ErrorEquals:
                        - States.ALL
                      ResultPath: $.error
                      Next: RecordInsurerFailure
                  End: true
                RecordInsurerTimeout:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName:
                      Fn::GetAtt: [workflowSteps, Arn]
                    Payload:
                      step: record-insurer-outcome
                      outcome: TIMED_OUT
                      quoteId.$: $.quoteId
                      version.$: $.version
                      insurerId.$: $.insurerId
                      error.$: $.error
                  TimeoutSeconds: ${param:stepsTimeoutSeconds}
                  Retry: *lambdaInvocationRetry
                  End: true
                RecordInsurerFailure:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName:
                      Fn::GetAtt: [workflowSteps, Arn]
                    Payload:
                      step: record-insurer-outcome
                      outcome: UNAVAILABLE
                      quoteId.$: $.quoteId
                      version.$: $.version
                      insurerId.$: $.insurerId
                      error.$: $.error
                  TimeoutSeconds: ${param:stepsTimeoutSeconds}
                  Retry: *lambdaInvocationRetry
                  End: true
            # Os resultados ficam no DynamoDB; a saída dos itens é descartada (ADR 0014)
            ResultPath: null
            Next: ConsolidateQuote
          ConsolidateQuote:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName:
                Fn::GetAtt: [workflowSteps, Arn]
              Payload:
                step: consolidate
                quoteId.$: $.quoteId
                version.$: $.version
            ResultSelector:
              outcome.$: $.Payload.outcome
              outcomeReason.$: $.Payload.outcomeReason
            ResultPath: $.consolidation
            TimeoutSeconds: ${param:stepsTimeoutSeconds}
            Retry: *lambdaInvocationRetry
            End: true

resources:
  Conditions:
    HasAwsEndpointUrl: !Not [!Equals ["${param:awsEndpointUrl}", ""]]
    HasAlarmEmail: !Not [!Equals ["${param:alarmEmail}", ""]]

  Resources:
    QuotesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.names.table}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: gsi1pk
            AttributeType: S
          - AttributeName: gsi1sk
            AttributeType: S
          - AttributeName: gsi2pk
            AttributeType: S
          - AttributeName: gsi2sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          # Listagem por organização: ORG#<organizationId> e ISSUES#<organizationId> (ADR 0015)
          - IndexName: gsi1
            KeySchema:
              - AttributeName: gsi1pk
                KeyType: HASH
              - AttributeName: gsi1sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          # Índice esparso do trabalho pendente que a reconciliação varre, como OUTBOX_PENDING
          - IndexName: gsi2
            KeySchema:
              - AttributeName: gsi2pk
                KeyType: HASH
              - AttributeName: gsi2sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_IMAGE

    ResultsDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.names.resultsDeadLetterQueue}
        MessageRetentionPeriod: 1209600

    ResultsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.names.resultsQueue}
        VisibilityTimeout: ${param:resultsVisibilityTimeoutSeconds}
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ResultsDeadLetterQueue.Arn
          maxReceiveCount: ${param:resultsMaxReceiveCount}

    ResultsQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ResultsQueue
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt ResultsQueue.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt ProviderResultsRule.Arn

    IssuesDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.names.issuesDeadLetterQueue}
        MessageRetentionPeriod: 1209600

    IssuesQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.names.issuesQueue}
        VisibilityTimeout: ${param:issuesVisibilityTimeoutSeconds}
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt IssuesDeadLetterQueue.Arn
          maxReceiveCount: ${param:issuesMaxReceiveCount}

    IssuesQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref IssuesQueue
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt IssuesQueue.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt ProviderIssuesRule.Arn

    # Destino onFailure do stream: só aponta shard e faixa de sequência, para o alarme (M4); sem consumidor
    StreamFailuresQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.names.streamFailuresQueue}
        MessageRetentionPeriod: 1209600

    # NOTE: a assinatura por e-mail só existe com o param alarmEmail preenchido e precisa ser confirmada pelo
    # link que a AWS envia
    AlarmsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${sls:stage}-alarms

    AlarmsEmailSubscription:
      Type: AWS::SNS::Subscription
      Condition: HasAlarmEmail
      Properties:
        TopicArn: !Ref AlarmsTopic
        Protocol: email
        Endpoint: ${param:alarmEmail}

    # Alarmes do M4 (§9), notificados no AlarmsTopic; o Floci só reconhece o tipo do recurso e não dispara (§13).
    # Volume e idade de cada DLQ e da stream-failures; outbox envelhecida e tarefas expiradas pelas métricas EMF
    # do reconciler
    ResultsDeadLetterQueueMessagesAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-results-dlq-messages
        AlarmDescription: Mensagens na results-dlq, à espera do reprocessamento pelo reconciler
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: ${self:custom.names.resultsDeadLetterQueue}
        Statistic: Maximum
        Period: ${param:alarmPeriodSeconds}
        EvaluationPeriods: 1
        Threshold: ${param:dlqAlarmMessages}
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsTopic

    ResultsDeadLetterQueueAgeAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-results-dlq-age
        AlarmDescription: Mensagem parada na results-dlq além do limiar de idade
        Namespace: AWS/SQS
        MetricName: ApproximateAgeOfOldestMessage
        Dimensions:
          - Name: QueueName
            Value: ${self:custom.names.resultsDeadLetterQueue}
        Statistic: Maximum
        Period: ${param:alarmPeriodSeconds}
        EvaluationPeriods: 1
        Threshold: ${param:dlqAlarmAgeSeconds}
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsTopic

    IssuesDeadLetterQueueMessagesAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-issues-dlq-messages
        AlarmDescription: Mensagens na issues-dlq, à espera do reprocessamento pelo reconciler
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: ${self:custom.names.issuesDeadLetterQueue}
        Statistic: Maximum
        Period: ${param:alarmPeriodSeconds}
        EvaluationPeriods: 1
        Threshold: ${param:dlqAlarmMessages}
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsTopic

    IssuesDeadLetterQueueAgeAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-issues-dlq-age
        AlarmDescription: Mensagem parada na issues-dlq além do limiar de idade
        Namespace: AWS/SQS
        MetricName: ApproximateAgeOfOldestMessage
        Dimensions:
          - Name: QueueName
            Value: ${self:custom.names.issuesDeadLetterQueue}
        Statistic: Maximum
        Period: ${param:alarmPeriodSeconds}
        EvaluationPeriods: 1
        Threshold: ${param:dlqAlarmAgeSeconds}
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsTopic

    StreamFailuresQueueMessagesAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-stream-failures-messages
        AlarmDescription: Registros do stream descartados pela relay; o outbox volta pelo reconciler
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: ${self:custom.names.streamFailuresQueue}
        Statistic: Maximum
        Period: ${param:alarmPeriodSeconds}
        EvaluationPeriods: 1
        Threshold: ${param:dlqAlarmMessages}
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsTopic

    StreamFailuresQueueAgeAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-stream-failures-age
        AlarmDescription: Falha do stream sem tratamento além do limiar de idade
        Namespace: AWS/SQS
        MetricName: ApproximateAgeOfOldestMessage
        Dimensions:
          - Name: QueueName
            Value: ${self:custom.names.streamFailuresQueue}
        Statistic: Maximum
        Period: ${param:alarmPeriodSeconds}
        EvaluationPeriods: 1
        Threshold: ${param:dlqAlarmAgeSeconds}
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsTopic

    OutboxPendingAgeAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-outbox-pending-age
        AlarmDescription: Outbox pendente mais antigo que o limiar, medido pelo createdAt
        Namespace: ${self:custom.metricsNamespace}
        MetricName: OutboxPendingAgeSeconds
        Dimensions:
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Maximum
        Period: ${param:alarmPeriodSeconds}
        EvaluationPeriods: 1
        Threshold: ${param:outboxAlarmAgeSeconds}
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsTopic

    ExpiredTasksAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-expired-tasks
        AlarmDescription: Resultado gravado que a execução encerrada não recebeu (TASK_EXPIRED)
        Namespace: ${self:custom.metricsNamespace}
        MetricName: ExpiredTasks
        Dimensions:
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Sum
        Period: ${param:alarmPeriodSeconds}
        EvaluationPeriods: 1
        Threshold: ${param:expiredTasksAlarmThreshold}
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsTopic

    # source e detail-type precisam bater com os eventos da provider-solution (docs/events)
    ProviderResultsRule:
      Type: AWS::Events::Rule
      Properties:
        EventBusName: ${self:custom.names.platformEventBus}
        EventPattern:
          source:
            - mmda.provider
          detail-type:
            - EnrichmentResolved
            - InsurerResultRecorded
        Targets:
          - Id: quote-results-queue
            Arn: !GetAtt ResultsQueue.Arn

    # Ocorrências e reconciliações da provider, projetadas pelo issue-projector (M5, §7)
    ProviderIssuesRule:
      Type: AWS::Events::Rule
      Properties:
        EventBusName: ${self:custom.names.platformEventBus}
        EventPattern:
          source:
            - mmda.provider
          detail-type:
            - QueryReconciled
            - OperationIssueRaised
            - OperationIssueUpdated
        Targets:
          - Id: quote-issues-queue
            Arn: !GetAtt IssuesQueue.Arn

    TokenKeySecret:
      Type: AWS::SecretsManager::Secret
      Properties:
        Name: ${self:custom.names.tokenKeySecret}
        Description: Chave da cifra dos task tokens guardados nos waiters da quote-solution
        GenerateSecretString:
          PasswordLength: 64
          ExcludePunctuation: true

    QuoteUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:custom.names.userPool}
        AdminCreateUserConfig:
          AllowAdminCreateUserOnly: true
        Policies:
          PasswordPolicy:
            MinimumLength: 12
            RequireLowercase: true
            RequireUppercase: true
            RequireNumbers: true
            RequireSymbols: true

    QuoteUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:custom.names.userPoolClient}
        UserPoolId: !Ref QuoteUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_SRP_AUTH
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        PreventUserExistenceErrors: ENABLED

    # A organização vem do grupo org_<organizationId>; as permissões, dos grupos perm_* (§11 do desenho)
    OrgAcmeGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: org_org-acme
        UserPoolId: !Ref QuoteUserPool
    OrgGlobexGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: org_org-globex
        UserPoolId: !Ref QuoteUserPool
    PermQuotesReadGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: perm_quotes_read
        UserPoolId: !Ref QuoteUserPool
    PermQuotesWriteGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: perm_quotes_write
        UserPoolId: !Ref QuoteUserPool
    PermOffersSelectGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: perm_offers_select
        UserPoolId: !Ref QuoteUserPool
    PermOperationsReadGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: perm_operations_read
        UserPoolId: !Ref QuoteUserPool
    PermOperationsReconcileGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: perm_operations_reconcile
        UserPoolId: !Ref QuoteUserPool

    # Um papel por função, com o mínimo de cada uma (§7 do desenho). ARN da máquina montado por nome:
    # um Ref à máquina criaria ciclo com as Lambdas que ela invoca. A política <papel>-logs libera só o grupo de
    # log da própria função, que o Serverless cria na stack, no lugar da AWSLambdaBasicExecutionRole (logs em *)
    ApiRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: &lambdaTrust
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: quote-api
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                # UpdateItem: a nova versão e a seleção atualizam o META na transação (§8); ConditionCheckItem: a
                # seleção confere a validade da oferta na mesma transação (M5)
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:ConditionCheckItem
                    - dynamodb:Query
                  Resource: !GetAtt QuotesTable.Arn
                # Listagens de cotações e de ocorrências da organização (M5, §11)
                - Effect: Allow
                  Action: dynamodb:Query
                  Resource: !Join ["", [!GetAtt QuotesTable.Arn, "/index/gsi1"]]
          - PolicyName: quote-api-logs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: ${self:custom.functionLogGroupArn}-api:*

    WorkflowStepsRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrust
        Policies:
          - PolicyName: quote-workflow-steps
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:Query
                  Resource: !GetAtt QuotesTable.Arn
          - PolicyName: quote-workflow-steps-logs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: ${self:custom.functionLogGroupArn}-workflowSteps:*

    DispatchRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrust
        Policies:
          - PolicyName: quote-dispatch
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:Query
                  Resource: !GetAtt QuotesTable.Arn
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref TokenKeySecret
                - Effect: Allow
                  Action: states:SendTaskSuccess
                  Resource: ${self:custom.stateMachineArn}
          - PolicyName: quote-dispatch-logs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: ${self:custom.functionLogGroupArn}-dispatch:*

    ResumeRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrust
        Policies:
          - PolicyName: quote-resume
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:Query
                  Resource: !GetAtt QuotesTable.Arn
                - Effect: Allow
                  Action:
                    - sqs:ReceiveMessage
                    - sqs:DeleteMessage
                    - sqs:GetQueueAttributes
                  Resource: !GetAtt ResultsQueue.Arn
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref TokenKeySecret
                - Effect: Allow
                  Action: states:SendTaskSuccess
                  Resource: ${self:custom.stateMachineArn}
          - PolicyName: quote-resume-logs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: ${self:custom.functionLogGroupArn}-resume:*

    IssueProjectorRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrust
        Policies:
          - PolicyName: quote-issue-projector
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                # ISSUE#, OPERATION#, QUERYREF# e CONSUMED# numa transação (M5, §7); o GetItem lê a organização
                # do OPERATION# antes de projetar um QueryReconciled
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                  Resource: !GetAtt QuotesTable.Arn
                - Effect: Allow
                  Action:
                    - sqs:ReceiveMessage
                    - sqs:DeleteMessage
                    - sqs:GetQueueAttributes
                  Resource: !GetAtt IssuesQueue.Arn
          - PolicyName: quote-issue-projector-logs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: ${self:custom.functionLogGroupArn}-issueProjector:*

    OutboxRelayRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrust
        Policies:
          - PolicyName: quote-outbox-relay
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:DescribeStream
                    - dynamodb:GetRecords
                    - dynamodb:GetShardIterator
                  Resource: !GetAtt QuotesTable.StreamArn
                # ListStreams não aceita recurso específico
                - Effect: Allow
                  Action: dynamodb:ListStreams
                  Resource: "*"
                - Effect: Allow
                  Action: dynamodb:UpdateItem
                  Resource: !GetAtt QuotesTable.Arn
                - Effect: Allow
                  Action: events:PutEvents
                  Resource: ${self:custom.platformEventBusArn}
                - Effect: Allow
                  Action: states:StartExecution
                  Resource: ${self:custom.stateMachineArn}
                - Effect: Allow
                  Action: sqs:SendMessage
                  Resource: !GetAtt StreamFailuresQueue.Arn
          - PolicyName: quote-outbox-relay-logs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: ${self:custom.functionLogGroupArn}-outboxRelay:*

    # WHY: também é o papel de execução do agendamento (method: scheduler); com papel próprio, o Serverless não
    # acrescenta a confiança no Scheduler nem o lambda:InvokeFunction, que ficam aqui
    ReconcilerRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
            - Effect: Allow
              Principal:
                Service: scheduler.amazonaws.com
              Action: sts:AssumeRole
              Condition:
                StringEquals:
                  aws:SourceAccount: ${aws:accountId}
        Policies:
          - PolicyName: quote-reconciler
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                # PutItem e Query na tabela: a finalização (T20) grava o outbox QuoteCompleted e lê os itens da
                # versão; UpdateItem também grava as ocorrências e o resumo do META (§9)
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:Query
                  Resource: !GetAtt QuotesTable.Arn
                - Effect: Allow
                  Action: dynamodb:Query
                  Resource: !Join ["", [!GetAtt QuotesTable.Arn, "/index/gsi2"]]
                - Effect: Allow
                  Action: events:PutEvents
                  Resource: ${self:custom.platformEventBusArn}
                # SendTaskSuccess retoma o waiter parado em RESUMING (T13), com a chave da cifra dos tokens
                - Effect: Allow
                  Action:
                    - states:StartExecution
                    - states:SendTaskSuccess
                  Resource: ${self:custom.stateMachineArn}
                # GetExecutionHistory confere se o resultado gravado chegou à execução antes do TASK_EXPIRED
                - Effect: Allow
                  Action:
                    - states:DescribeExecution
                    - states:GetExecutionHistory
                  Resource: arn:aws:states:${aws:region}:${aws:accountId}:execution:${self:custom.names.stateMachine}:*
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref TokenKeySecret
                # Reprocessamento da results-dlq (ADR 0007): lê e apaga na DLQ e reenvia à fila results. A DLQ não
                # tem ESM, e o código não lê atributos da fila
                - Effect: Allow
                  Action:
                    - sqs:ReceiveMessage
                    - sqs:DeleteMessage
                  Resource: !GetAtt ResultsDeadLetterQueue.Arn
                - Effect: Allow
                  Action: sqs:SendMessage
                  Resource: !GetAtt ResultsQueue.Arn
                # Reprocessamento da issues-dlq (M5), no mesmo padrão
                - Effect: Allow
                  Action:
                    - sqs:ReceiveMessage
                    - sqs:DeleteMessage
                  Resource: !GetAtt IssuesDeadLetterQueue.Arn
                - Effect: Allow
                  Action: sqs:SendMessage
                  Resource: !GetAtt IssuesQueue.Arn
                # WHY: ARN montado por nome, porque um GetAtt da função no papel dela criaria ciclo
                - Effect: Allow
                  Action: lambda:InvokeFunction
                  Resource:
                    - arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${sls:stage}-reconciler
                    - arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${sls:stage}-reconciler:*
          - PolicyName: quote-reconciler-logs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: ${self:custom.functionLogGroupArn}-reconciler:*

  Outputs:
    QuotesTableName:
      Value: !Ref QuotesTable
    QuoteUserPoolId:
      Value: !Ref QuoteUserPool
    QuoteUserPoolClientId:
      Value: !Ref QuoteUserPoolClient
    ResultsQueueUrl:
      Value: !Ref ResultsQueue
    IssuesQueueUrl:
      Value: !Ref IssuesQueue
