# Handler padrão do zip; cada Lambda escolhe o seu com QUARKUS_LAMBDA_HANDLER no serverless.yml
quarkus.lambda.handler=workflow-steps

quote.table-name=${TABLE_NAME}
quote.event-bus-name=${EVENT_BUS_NAME}
quote.state-machine-arn=${STATE_MACHINE_ARN}
quote.token-key-secret-id=${TOKEN_KEY_SECRET_ID}
quote.max-insurers=${MAX_INSURERS}
quote.outbox-republish-after-seconds=${OUTBOX_REPUBLISH_AFTER_SECONDS}

# Mesmo client HTTP do spring-aws da plataforma Spring (ADR 0005)
quarkus.dynamodb.sync-client.type=aws-crt
quarkus.eventbridge.sync-client.type=aws-crt
quarkus.sfn.sync-client.type=aws-crt
quarkus.secretsmanager.sync-client.type=aws-crt

# WHY: os Dev Services subiriam um LocalStack; o ambiente local é o Floci, nos testes e nas Lambdas
quarkus.devservices.enabled=false

%test.quote.table-name=quotes-table
%test.quote.event-bus-name=platform-test-events
%test.quote.state-machine-arn=arn:aws:states:us-east-1:000000000000:stateMachine:quote-flow
%test.quote.token-key-secret-id=quote-solution/test/token-key
%test.quote.max-insurers=2
%test.quote.outbox-republish-after-seconds=30
