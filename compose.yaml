name: mmda-serverless

services:
  floci:
    image: floci/floci:2.4.0
    # root para usar o socket do Docker: as Lambdas rodam em containers reais
    user: root
    ports:
      - "4566:4566"
    environment:
      # Faz o Floci injetar AWS_ENDPOINT_URL=http://floci:4566 nas Lambdas e devolver URLs com esse host
      FLOCI_HOSTNAME: floci
      # O padrão de 10s não cobre o cold start do Spring na JVM
      FLOCI_SERVICES_LAMBDA_INIT_TIMEOUT_SECONDS: "120"
      # Grava cada escrita em disco: os recursos sobrevivem a reinícios sem novo deploy
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
    networks:
      - floci

  floci-ui:
    image: floci/floci-ui:0.7.0
    # Console web em http://localhost:4500; a API da console fala com o Floci pela rede interna
    ports:
      - "4500:4500"
    environment:
      # Só o emulador AWS sobe aqui; sem isso a console oferece Azure, GCP e OCI, que não existem
      FLOCI_CLOUD: aws
      # Dentro do container, localhost é o próprio container: o Floci é alcançado pelo nome do serviço
      FLOCI_ENDPOINT: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      - floci
    networks:
      - floci

volumes:
  floci-data:

networks:
  floci:
    name: floci
