service: provider-solution

frameworkVersion: "4"

plugins:
  - serverless-localstack

# Parâmetros do §12 do desenho. As invariantes de tempo do §9 (timeout do worker, lease, visibilidade
# das filas) são conferidas pelo ServerlessConfigurationTest, em provider-functions
params:
  default:
    # WHY: vazio na AWS, a condição HasAwsEndpointUrl tira AWS_ENDPOINT_URL e AWS_ENDPOINT_URL_S3 das funções e o
    # SDK resolve o endpoint pela região; o SDK trataria um valor vazio como endpoint, então a variável não pode existir
    awsEndpointUrl: ""
    s3PathStyleAccess: "false"
    # Fn::Sub: o ApiGatewayRestApi é o API Gateway desta stack, que atende os simuladores (§7)
    providersBaseUrl: https://${ApiGatewayRestApi}.execute-api.${aws:region}.amazonaws.com/${sls:stage}
    providerHttpTimeoutSeconds: 5
    workerRetries: 2
    retryBackoffMaxSeconds: 3
    workerTimeoutSeconds: 25
    enrichmentLeaseSeconds: 30
    inflightTombstoneSeconds: 3600
    # Versão da política de reuso, dona da validade do enriquecimento: vai na evidência, no REUSE# e no
    # EnrichmentResolved; um REUSE# de outra versão não serve de HIT
    reusePolicyVersion: "reuse-v1"
    enrichmentValiditySeconds: 900
    offerValiditySeconds: 1800
    # Quota por provedor e credencial, numa janela de 1 min comum a todos os workflows (T21); a credencial
    # compõe a chave do QUOTA# e é a mesma para todos os provedores no MVP
    providerCredentialRef: default
    enrichmentSimQuotaPerMinute: 30
    alphaQuotaPerMinute: 30
    betaQuotaPerMinute: 30
    # Atraso dos callbacks da beta; o do vehicle-beta-late passa da espera da seguradora na quote (90 s na AWS)
    betaCallbackDelaySeconds: 3
    betaLateCallbackDelaySeconds: 120
    outboxRepublishAfterSeconds: 30
    dlqMaxAttempts: 3
    # Callback sem correlação vira UNMATCHED depois deste prazo; antes dele, o reconciler só refaz o encontro do
    # callback RECEIVED parado há mais que inboxStuckAfterSeconds, que passa do timeout da api (§9)
    unmatchedCallbackAfterSeconds: 60
    inboxStuckAfterSeconds: 30
    # Idade do createdAt que abre STALE_OUTBOX; é também o limiar do alarme da outbox (§12)
    staleOutboxAfterSeconds: 120
    # Teto das leituras da API de situação por ciclo, para inbox, DLQs e métricas caberem no timeout do reconciler
    statusReadBudgetSeconds: 30
    # Limiares dos alarmes (§12)
    dlqAlarmVisibleMessages: 1
    dlqAlarmAgeSeconds: 300
    unmatchedCallbacksAlarmThreshold: 1
    unknownQueriesAlarmThreshold: 1
    providerFailureAlarmPercent: 50
    providerFailureAlarmPeriodSeconds: 300
    requestQueueVisibilityTimeoutSeconds: 150
    requestQueueMaxReceiveCount: 3
    simCallbackSenderTimeoutSeconds: 15
    simCallbacksVisibilityTimeoutSeconds: 90
    simCallbacksMaxReceiveCount: 5
    reconcilerRate: rate(1 minute)
    # NOTE: vazio não cria a assinatura por e-mail do tópico de alarmes
    alarmEmail: ""
  local:
    awsEndpointUrl: http://floci:4566
    s3PathStyleAccess: "true"
    providersBaseUrl: http://floci:4566/restapis/${ApiGatewayRestApi}/local/_user_request_
    # A espera da seguradora no local é de 20 s (insurerTimeoutSeconds da quote)
    betaLateCallbackDelaySeconds: 30

custom:
  names:
    queriesTable: ${self:service}-${sls:stage}-queries
    simulatorsTable: ${self:service}-${sls:stage}-simulators
    payloadsBucket: ${self:service}-${sls:stage}-payloads
    enrichmentRequestsQueue: ${self:service}-${sls:stage}-enrichment-requests
    enrichmentRequestsDeadLetterQueue: ${self:service}-${sls:stage}-enrichment-requests-dlq
    insurerRequestsQueue: ${self:service}-${sls:stage}-insurer-requests
    insurerRequestsDeadLetterQueue: ${self:service}-${sls:stage}-insurer-requests-dlq
    reconcileRequestsQueue: ${self:service}-${sls:stage}-reconcile-requests
    reconcileRequestsDeadLetterQueue: ${self:service}-${sls:stage}-reconcile-requests-dlq
    streamFailuresQueue: ${self:service}-${sls:stage}-stream-failures
    simCallbacksQueue: ${self:service}-${sls:stage}-sim-callbacks
    simCallbacksDeadLetterQueue: ${self:service}-${sls:stage}-sim-callbacks-dlq
    queryKeySecret: ${self:service}/${sls:stage}/query-key-secret
    callbackSecret: ${self:service}/${sls:stage}/callback-secret
  # Barramento da plataforma pela convenção de nomes, sem referência entre stacks (ADR 0013)
  platformEventBus: platform-${sls:stage}-events
  platformEventBusArn: arn:aws:events:${aws:region}:${aws:accountId}:event-bus/${self:custom.platformEventBus}
  # Namespace das métricas EMF dos workers e do reconciler, lido pelos alarmes (§9)
  metricsNamespace: mmda/provider-solution
  functionsPackage: functions/target/provider-functions-lambda.zip
  functionsHandler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
  functionsMainClass: com.mmda.serverless.provider.functions.FunctionsApplication
  localstack:
    stages:
      - local
    host: http://localhost
    edgePort: 4566
    autostart: false

provider:
  name: aws
  runtime: java21
  region: us-east-1
  stage: ${opt:stage, 'local'}
  # WHY: padrão de todas as funções; 1.769 MB equivale a 1 vCPU na Lambda, que reparte CPU pela memória
  memorySize: 1769
  timeout: 30
  environment:
    AWS_ENDPOINT_URL: !If [HasAwsEndpointUrl, "${param:awsEndpointUrl}", !Ref AWS::NoValue]
    # O Serverless v4 exporta AWS_ENDPOINT_URL_S3 do LocalStack quando o serverless-localstack está ativo
    AWS_ENDPOINT_URL_S3: !If [HasAwsEndpointUrl, "${param:awsEndpointUrl}", !Ref AWS::NoValue]
    S3_PATH_STYLE_ACCESS: ${param:s3PathStyleAccess}
    TABLE_NAME: ${self:custom.names.queriesTable}
    PAYLOADS_BUCKET: ${self:custom.names.payloadsBucket}
    EVENT_BUS_NAME: ${self:custom.platformEventBus}
    QUERY_KEY_SECRET_ID: ${self:custom.names.queryKeySecret}
    ENRICHMENT_REQUESTS_QUEUE_URL: !Ref EnrichmentRequestsQueue
    INSURER_REQUESTS_QUEUE_URL: !Ref InsurerRequestsQueue
    PROVIDER_HTTP_TIMEOUT_SECONDS: "${param:providerHttpTimeoutSeconds}"
    WORKER_RETRIES: "${param:workerRetries}"
    RETRY_BACKOFF_MAX_SECONDS: "${param:retryBackoffMaxSeconds}"
    WORKER_TIMEOUT_SECONDS: "${param:workerTimeoutSeconds}"
    ENRICHMENT_VALIDITY_SECONDS: "${param:enrichmentValiditySeconds}"
    ENRICHMENT_LEASE_SECONDS: "${param:enrichmentLeaseSeconds}"
    INFLIGHT_TOMBSTONE_SECONDS: "${param:inflightTombstoneSeconds}"
    REUSE_POLICY_VERSION: "${param:reusePolicyVersion}"
    OUTBOX_REPUBLISH_AFTER_SECONDS: "${param:outboxRepublishAfterSeconds}"
    PROVIDER_CREDENTIAL_REF: ${param:providerCredentialRef}
    ENRICHMENT_SIM_QUOTA_PER_MINUTE: "${param:enrichmentSimQuotaPerMinute}"
    ALPHA_QUOTA_PER_MINUTE: "${param:alphaQuotaPerMinute}"
    BETA_QUOTA_PER_MINUTE: "${param:betaQuotaPerMinute}"
    STAGE: ${sls:stage}
    METRICS_NAMESPACE: ${self:custom.metricsNamespace}
  # Papel das funções da provider; têm papel próprio a Lambda dos simuladores (SimulatorsRole), a API de callbacks
  # (CallbacksApiRole) e o simCallbackSender (SimCallbackSenderRole). O reuso do enriquecimento (REUSE#, INFLIGHT#
  # e FOLLOWER#) usa as mesmas ações na tabela de consultas
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:ConditionCheckItem
            - dynamodb:Query
          Resource:
            - !GetAtt QueriesTable.Arn
            - !Join ["/", [!GetAtt QueriesTable.Arn, "index", "gsi2"]]
        - Effect: Allow
          Action: s3:PutObject
          Resource: arn:aws:s3:::${self:custom.names.payloadsBucket}/raw/*
        - Effect: Allow
          Action: events:PutEvents
          Resource: ${self:custom.platformEventBusArn}
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource: !Ref QueryKeySecret
        # Reenvio adiado sem quota (§9), destino de falha do stream da relay e devolução das DLQs à fila de origem
        - Effect: Allow
          Action: sqs:SendMessage
          Resource:
            - !GetAtt EnrichmentRequestsQueue.Arn
            - !GetAtt InsurerRequestsQueue.Arn
            - !GetAtt ReconcileRequestsQueue.Arn
            - !GetAtt SimCallbacksQueue.Arn
            - !GetAtt StreamFailuresQueue.Arn
        # O reconciler lê e apaga as DLQs no reprocessamento (ADR 0007); as DLQs não têm ESM, e o código não lê
        # atributos da fila
        - Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
          Resource:
            - !GetAtt EnrichmentRequestsDeadLetterQueue.Arn
            - !GetAtt InsurerRequestsDeadLetterQueue.Arn
            - !GetAtt ReconcileRequestsDeadLetterQueue.Arn
            - !GetAtt SimCallbacksDeadLetterQueue.Arn

package:
  individually: true

functions:
  # API de callbacks das seguradoras assíncronas (§7); papel próprio, porque os workers não podem ler o
  # callback-secret
  api:
    handler: com.mmda.serverless.provider.api.StreamLambdaHandler::handleRequest
    timeout: 29
    role: CallbacksApiRole
    package:
      artifact: api/target/provider-api-lambda.zip
    environment:
      CALLBACK_SECRET_ID: ${self:custom.names.callbackSecret}
    events:
      - http:
          path: v1/providers/{provider}/callbacks
          method: post

  simulators:
    handler: com.mmda.serverless.provider.simulators.StreamLambdaHandler::handleRequest
    timeout: 29
    role: SimulatorsRole
    package:
      artifact: simulators/target/provider-simulators-lambda.zip
    environment:
      SIMULATORS_TABLE_NAME: ${self:custom.names.simulatorsTable}
      OFFER_VALIDITY_SECONDS: "${param:offerValiditySeconds}"
      SIM_CALLBACKS_QUEUE_URL: !Ref SimCallbacksQueue
      BETA_CALLBACK_DELAY_SECONDS: "${param:betaCallbackDelaySeconds}"
      BETA_LATE_CALLBACK_DELAY_SECONDS: "${param:betaLateCallbackDelaySeconds}"
    events:
      - http:
          path: sim/{proxy+}
          method: any

  # O fornecedor simulado entrega os callbacks agendados pela beta, assinados, na API da própria stack
  simCallbackSender:
    handler: com.mmda.serverless.provider.simulators.SimCallbackSenderHandler::handleRequest
    timeout: ${param:simCallbackSenderTimeoutSeconds}
    role: SimCallbackSenderRole
    package:
      artifact: simulators/target/provider-simulators-lambda.zip
    environment:
      CALLBACK_SECRET_ID: ${self:custom.names.callbackSecret}
      CALLBACKS_BASE_URL:
        Fn::Sub: ${param:providersBaseUrl}
    events:
      - sqs:
          arn: !GetAtt SimCallbacksQueue.Arn
          batchSize: 1
          functionResponseType: ReportBatchItemFailures

  enrichmentWorker:
    handler: ${self:custom.functionsHandler}
    timeout: ${param:workerTimeoutSeconds}
    package:
      artifact: ${self:custom.functionsPackage}
    environment:
      MAIN_CLASS: ${self:custom.functionsMainClass}
      SPRING_CLOUD_FUNCTION_DEFINITION: enrichmentWorker
      PROVIDERS_BASE_URL:
        Fn::Sub: ${param:providersBaseUrl}
    events:
      - sqs:
          arn: !GetAtt EnrichmentRequestsQueue.Arn
          batchSize: 1
          functionResponseType: ReportBatchItemFailures

  insurerWorker:
    handler: ${self:custom.functionsHandler}
    timeout: ${param:workerTimeoutSeconds}
    package:
      artifact: ${self:custom.functionsPackage}
    environment:
      MAIN_CLASS: ${self:custom.functionsMainClass}
      SPRING_CLOUD_FUNCTION_DEFINITION: insurerWorker
      PROVIDERS_BASE_URL:
        Fn::Sub: ${param:providersBaseUrl}
    events:
      - sqs:
          arn: !GetAtt InsurerRequestsQueue.Arn
          batchSize: 1
          functionResponseType: ReportBatchItemFailures

  # Reconciliação manual pedida pela quote (QueryReconcileRequested); consulta a API de situação, sem nova cotação
  reconcileWorker:
    handler: ${self:custom.functionsHandler}
    timeout: ${param:workerTimeoutSeconds}
    package:
      artifact: ${self:custom.functionsPackage}
    environment:
      MAIN_CLASS: ${self:custom.functionsMainClass}
      SPRING_CLOUD_FUNCTION_DEFINITION: reconcileWorker
      PROVIDERS_BASE_URL:
        Fn::Sub: ${param:providersBaseUrl}
    events:
      - sqs:
          arn: !GetAtt ReconcileRequestsQueue.Arn
          batchSize: 1
          functionResponseType: ReportBatchItemFailures

  outboxRelay:
    handler: ${self:custom.functionsHandler}
    timeout: 60
    package:
      artifact: ${self:custom.functionsPackage}
    environment:
      MAIN_CLASS: ${self:custom.functionsMainClass}
      SPRING_CLOUD_FUNCTION_DEFINITION: outboxRelay
    events:
      # Lotes de 100 só no stream; retries limitados para um registro com erro não bloquear o shard (§7, §13)
      - stream:
          type: dynamodb
          arn: !GetAtt QueriesTable.StreamArn
          batchSize: 100
          startingPosition: TRIM_HORIZON
          maximumRetryAttempts: 3
          bisectBatchOnFunctionError: true
          functionResponseType: ReportBatchItemFailures
          destinations:
            onFailure:
              arn: !GetAtt StreamFailuresQueue.Arn
              type: sqs
          filterPatterns:
            - eventName:
                - INSERT
              dynamodb:
                NewImage:
                  type:
                    S:
                      - OUTBOX

  reconciler:
    handler: ${self:custom.functionsHandler}
    timeout: 60
    package:
      artifact: ${self:custom.functionsPackage}
    environment:
      MAIN_CLASS: ${self:custom.functionsMainClass}
      SPRING_CLOUD_FUNCTION_DEFINITION: reconciler
      PROVIDERS_BASE_URL:
        Fn::Sub: ${param:providersBaseUrl}
      UNMATCHED_CALLBACK_AFTER_SECONDS: "${param:unmatchedCallbackAfterSeconds}"
      INBOX_STUCK_AFTER_SECONDS: "${param:inboxStuckAfterSeconds}"
      STALE_OUTBOX_AFTER_SECONDS: "${param:staleOutboxAfterSeconds}"
      DLQ_MAX_ATTEMPTS: "${param:dlqMaxAttempts}"
      STATUS_READ_BUDGET_SECONDS: "${param:statusReadBudgetSeconds}"
      RECONCILE_REQUESTS_QUEUE_URL: !Ref ReconcileRequestsQueue
      SIM_CALLBACKS_QUEUE_URL: !Ref SimCallbacksQueue
      ENRICHMENT_REQUESTS_DLQ_URL: !Ref EnrichmentRequestsDeadLetterQueue
      INSURER_REQUESTS_DLQ_URL: !Ref InsurerRequestsDeadLetterQueue
      RECONCILE_REQUESTS_DLQ_URL: !Ref ReconcileRequestsDeadLetterQueue
      SIM_CALLBACKS_DLQ_URL: !Ref SimCallbacksDeadLetterQueue
    events:
      - schedule:
          method: scheduler
          rate: ${param:reconcilerRate}
          input:
            maxItems: 100

resources:
  Conditions:
    HasAwsEndpointUrl: !Not [!Equals ["${param:awsEndpointUrl}", ""]]
    HasAlarmEmail: !Not [!Equals ["${param:alarmEmail}", ""]]

  Resources:
    QueriesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.names.queriesTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: gsi2pk
            AttributeType: S
          - AttributeName: gsi2sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        # Índice esparso do trabalho pendente (ADR 0015): OUTBOX_PENDING, QUERY_IN_FLIGHT, QUERY_UNKNOWN, INBOX_RECEIVED,
        # INBOX_UNMATCHED e, no M4, FANOUT_PENDING (fan-out do líder a terminar) e ISSUE_OPEN (ocorrência a conferir)
        GlobalSecondaryIndexes:
          - IndexName: gsi2
            KeySchema:
              - AttributeName: gsi2pk
                KeyType: HASH
              - AttributeName: gsi2sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_IMAGE
        # Expira as janelas de quota, a lápide do INFLIGHT# e os FOLLOWER#
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    SimulatorsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.names.simulatorsTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    PayloadsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.names.payloadsBucket}

    EnrichmentRequestsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.names.enrichmentRequestsQueue}
        VisibilityTimeout: ${param:requestQueueVisibilityTimeoutSeconds}
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt EnrichmentRequestsDeadLetterQueue.Arn
          maxReceiveCount: ${param:requestQueueMaxReceiveCount}

    EnrichmentRequestsDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.names.enrichmentRequestsDeadLetterQueue}
        MessageRetentionPeriod: 1209600

    InsurerRequestsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.names.insurerRequestsQueue}
        VisibilityTimeout: ${param:requestQueueVisibilityTimeoutSeconds}
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt InsurerRequestsDeadLetterQueue.Arn
          maxReceiveCount: ${param:requestQueueMaxReceiveCount}

    InsurerRequestsDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.names.insurerRequestsDeadLetterQueue}
        MessageRetentionPeriod: 1209600

    ReconcileRequestsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.names.reconcileRequestsQueue}
        VisibilityTimeout: ${param:requestQueueVisibilityTimeoutSeconds}
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ReconcileRequestsDeadLetterQueue.Arn
          maxReceiveCount: ${param:requestQueueMaxReceiveCount}

    ReconcileRequestsDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.names.reconcileRequestsDeadLetterQueue}
        MessageRetentionPeriod: 1209600

    SimCallbacksQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.names.simCallbacksQueue}
        VisibilityTimeout: ${param:simCallbacksVisibilityTimeoutSeconds}
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt SimCallbacksDeadLetterQueue.Arn
          maxReceiveCount: ${param:simCallbacksMaxReceiveCount}

    SimCallbacksDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.names.simCallbacksDeadLetterQueue}
        MessageRetentionPeriod: 1209600

    # Só destino de falha do stream da relay: aponta shard e faixa de sequência, sem consumidor (§9)
    StreamFailuresQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.names.streamFailuresQueue}
        MessageRetentionPeriod: 1209600

    # source e detail-type dos pedidos estão no AsyncAPI da quote-solution
    EnrichmentRequestedRule:
      Type: AWS::Events::Rule
      Properties:
        EventBusName: ${self:custom.platformEventBus}
        EventPattern:
          source:
            - mmda.quote
          detail-type:
            - EnrichmentRequested
        Targets:
          - Id: enrichment-requests
            Arn: !GetAtt EnrichmentRequestsQueue.Arn

    InsurerQuoteRequestedRule:
      Type: AWS::Events::Rule
      Properties:
        EventBusName: ${self:custom.platformEventBus}
        EventPattern:
          source:
            - mmda.quote
          detail-type:
            - InsurerQuoteRequested
        Targets:
          - Id: insurer-requests
            Arn: !GetAtt InsurerRequestsQueue.Arn

    QueryReconcileRequestedRule:
      Type: AWS::Events::Rule
      Properties:
        EventBusName: ${self:custom.platformEventBus}
        EventPattern:
          source:
            - mmda.quote
          detail-type:
            - QueryReconcileRequested
        Targets:
          - Id: reconcile-requests
            Arn: !GetAtt ReconcileRequestsQueue.Arn

    EnrichmentRequestsQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref EnrichmentRequestsQueue
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt EnrichmentRequestsQueue.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt EnrichmentRequestedRule.Arn

    InsurerRequestsQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref InsurerRequestsQueue
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt InsurerRequestsQueue.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt InsurerQuoteRequestedRule.Arn

    ReconcileRequestsQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ReconcileRequestsQueue
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt ReconcileRequestsQueue.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt QueryReconcileRequestedRule.Arn

    QueryKeySecret:
      Type: AWS::SecretsManager::Secret
      Properties:
        Name: ${self:custom.names.queryKeySecret}
        GenerateSecretString:
          PasswordLength: 48
          ExcludePunctuation: true

    # Assinatura dos callbacks (X-Signature), usada pela API de callbacks e pelo simCallbackSender
    CallbackSecret:
      Type: AWS::SecretsManager::Secret
      Properties:
        Name: ${self:custom.names.callbackSecret}
        GenerateSecretString:
          PasswordLength: 48
          ExcludePunctuation: true

    # A tabela dos simuladores é acessada só pela Lambda simulators (§2)
    SimulatorsRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: simulators
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-simulators:*
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                  Resource: !GetAtt SimulatorsTable.Arn
                # A beta agenda os callbacks com atraso
                - Effect: Allow
                  Action: sqs:SendMessage
                  Resource: !GetAtt SimCallbacksQueue.Arn

    # O simCallbackSender só consome a fila sim-callbacks e lê o segredo que assina os callbacks
    SimCallbackSenderRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: sim-callback-sender
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-simCallbackSender:*
                - Effect: Allow
                  Action:
                    - sqs:ReceiveMessage
                    - sqs:DeleteMessage
                    - sqs:GetQueueAttributes
                  Resource: !GetAtt SimCallbacksQueue.Arn
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref CallbackSecret

    # A API de callbacks grava inbox, correlação e o resultado na tabela de consultas e a resposta bruta no bucket
    CallbacksApiRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: callbacks-api
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-api:*
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:Query
                  Resource: !GetAtt QueriesTable.Arn
                - Effect: Allow
                  Action: s3:PutObject
                  Resource: arn:aws:s3:::${self:custom.names.payloadsBucket}/raw/*
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref CallbackSecret

    # NOTE: a assinatura por e-mail só existe com o param alarmEmail preenchido e precisa ser confirmada pelo
    # link que a AWS envia
    AlarmsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${sls:stage}-alarms

    AlarmsEmailSubscription:
      Type: AWS::SNS::Subscription
      Condition: HasAlarmEmail
      Properties:
        TopicArn: !Ref AlarmsTopic
        Protocol: email
        Endpoint: ${param:alarmEmail}

    # Alarmes do M4 (§9, §12), com os limiares por stage e notificados no AlarmsTopic. O Floci só reconhece o tipo
    # do recurso e não dispara; o disparo é do M6

    EnrichmentRequestsDeadLetterQueueAgeAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-enrichment-requests-dlq-age
        AlarmDescription: Mensagem parada em enrichment-requests-dlq além do limiar de idade
        Namespace: AWS/SQS
        MetricName: ApproximateAgeOfOldestMessage
        Dimensions:
          - Name: QueueName
            Value: ${self:custom.names.enrichmentRequestsDeadLetterQueue}
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 1
        Threshold: ${param:dlqAlarmAgeSeconds}
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsTopic

    EnrichmentRequestsDeadLetterQueueVolumeAlarm:
