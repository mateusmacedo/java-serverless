        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: ${self:custom.names.enrichmentRequestsDeadLetterQueue}
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 1
        Threshold: ${param:dlqAlarmVisibleMessages}
