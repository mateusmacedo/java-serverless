    EnrichmentSimProviderFailuresAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-enrichment-sim-provider-failures
        AlarmDescription: Falhas técnicas de enrichment-sim acima do percentual das chamadas na janela
        Metrics:
          - Id: failures
            ReturnData: false
            MetricStat:
              Metric:
                Namespace: ${self:custom.metricsNamespace}
                MetricName: ProviderFailures
                Dimensions:
                  - Name: Stage
                    Value: ${sls:stage}
                  - Name: Provider
                    Value: enrichment-sim
              Period: ${param:providerFailureAlarmPeriodSeconds}
              Stat: Sum
          - Id: calls
            ReturnData: false
            MetricStat:
              Metric:
                Namespace: ${self:custom.metricsNamespace}
                MetricName: ProviderCalls
                Dimensions:
                  - Name: Stage
                    Value: ${sls:stage}
                  - Name: Provider
                    Value: enrichment-sim
              Period: ${param:providerFailureAlarmPeriodSeconds}
              Stat: Sum
          - Id: failureRate
            Label: Percentual de falhas
            Expression: IF(calls > 0, 100 * failures / calls, 0)
            ReturnData: true
        EvaluationPeriods: 1
        Threshold: ${param:providerFailureAlarmPercent}
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsTopic

