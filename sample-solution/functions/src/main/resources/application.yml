spring:
  main:
    # Cada Lambda executa uma só função; lazy evita criar os beans e clients das outras
    lazy-initialization: true

sample:
  bucket-name: ${BUCKET_NAME}
  table-name: ${TABLE_NAME}
  topic-arn: ${TOPIC_ARN}
  event-bus-name: ${EVENT_BUS_NAME}
  dead-letter-queue-name: ${DEAD_LETTER_QUEUE_NAME}
  state-machine-arn: ${STATE_MACHINE_ARN}
  max-payload-parameter: ${MAX_PAYLOAD_PARAMETER}
  signing-secret-id: ${SIGNING_SECRET_ID}
  max-attempts: ${MAX_ATTEMPTS:3}

mmda:
  aws:
    s3:
      path-style-access: ${S3_PATH_STYLE_ACCESS:false}
